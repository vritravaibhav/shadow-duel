name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Rename for humans
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/shadow-duel-${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/shadow-duel-${{ github.run_number }}.aab"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: shadow-duel-android
          path: dist
          retention-days: 14

      - name: Note the APK size in the run summary
        run: |
          SIZE=$(du -h "dist/shadow-duel-${{ github.run_number }}.apk" | cut -f1)
          {
            echo "## Android"
            echo ""
            echo "APK built (\`$SIZE\`), debug-signed for sideloading."
            echo "Direct download appears under **Publish APK** below once it finishes."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-apk:
    name: Publish APK
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shadow-duel-android
          path: dist

      - name: Publish release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Sideload build of Shadow Duel, straight from `main`.

            **On your phone:** tap the `.apk` below, then allow
            "install unknown apps" for your browser when Android asks.

            Signed with the Flutter debug key — fine for testing, not for the
            Play Store. The `.aab` is here for when you set up a real keystore.

            Commit: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.aab

      - name: Put the download link in the run summary
        run: |
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ github.run_number }}"
          {
            echo "## Install on Android"
            echo ""
            echo "**[Download shadow-duel-${{ github.run_number }}.apk]($BASE/shadow-duel-${{ github.run_number }}.apk)**"
            echo ""
            echo "Open this page on the phone and tap the link."
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - name: Package .app for download
        run: |
          mkdir -p build/ios-artifact
          cp -R build/ios/iphoneos/Runner.app build/ios-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-duel-ios-unsigned
          path: build/ios-artifact
          retention-days: 14

  web:
    name: Build & deploy web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # base-href must match the repo name for a project Pages site.
      - name: Build web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: shadow-duel-web
          path: build/web
          retention-days: 14

      # Deploy to Pages only from main; PRs just build.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Show the link in the run summary
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Play it"
            echo ""
            echo "**${{ steps.deployment.outputs.page_url }}**"
            echo ""
            echo "_Desktop browsers have one mouse pointer, so the two-stick skull smash"
            echo "is unreachable there — open it on a phone, or install the Android build._"
          } >> "$GITHUB_STEP_SUMMARY"
